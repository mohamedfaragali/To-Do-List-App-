[build]
  command = """
    curl https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.0-stable.tar.xz -o flutter.tar.xz && \
    tar xf flutter.tar.xz && \
    export PATH="$PWD/flutter/bin:$PATH" && \
    flutter build web --release
  """
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200